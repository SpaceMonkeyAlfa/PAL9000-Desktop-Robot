<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PAL9000 Client</title>
    <!-- face-api.js & socket.io -->
    <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #000a3f;
      overflow: hidden;
    }
    video { display: none; }
    .container {
      position: relative;
      height: 100%;
      width: 100%;
    }
    .svg-layer {
      position: absolute;
      top: 50%;
      left: 50%;
      max-width: 100%;
      max-height: 100%;
    }
    .midground {
      width: calc(99vh * 1.7);
      height: 99vh;
      max-width: 99vw;
      z-index: 0;
      background-color: #fff;
      transform: translate(-50%, -50%);
    }
    .mask-layer {
      width: auto;
      height: 100vh;
      max-width: 100vw;
      z-index: 3;
      transform: translate(-50%, -50%);
    }
    .pupil-layer {
      height: 44.5vh;
      width: auto;
      z-index: 1;
      left: 50%;
      top: 50%; 
      transform: translate(-50%, -50%);
      transition: left 0.15s ease-out, top 0.15s ease-out;
    }
    .mouth-layer {
      height: 20vh;
      width: auto;
      max-width: 100vw;
      z-index: 4;
      top: 20%;
      display: block;
      transform: translate(-50%, -20%) scaleY(1);
      transform-origin: center center;
    }
    .mouth-layer.is-talking {
      animation: talking 0.22s ease-in-out infinite alternate;
    }
    .eyelid-layer {
      z-index: 2;
      height: 50vh;
      width: auto;
      max-width: 100vw;
      position: fixed;  
      transition: transform 100ms ease;
      transform: translate(-50%, -50%);
    }
    .LBLid {
      top: 100%;
      left: calc((100vw - 1600vh/9)/2 + 10px);
      transform: translateY(0);
    }
    .RBLid {
      top: 100%;
      right: calc((100vw - 1600vh/9)/2 + 10px);
      transform: translateY(0);
    }
    .LTLid {
      top: -50%;
      left: calc((100vw - 1600vh/9)/2 + 10px);
      transform: translateY(0);
    }
    .RTLid {
      top: -50%;
      right: calc((100vw - 1600vh/9)/2 + 10px);
      transform: translateY(0);
    }
    .LBLid.closed, .RBLid.closed {
      transform: translateY(-130%) !important;
    }
    .RTLid.closed, .LTLid.closed {
      transform: translateY(130%) !important;
    }
    .mouth-box {
      overflow: visible;
      position: relative;
      height: 20vh;
      width: 40vw;
      max-width: 100vw;
      z-index: 4;
      top: 80%;
      left: 50%;
      transform: translate(-50%, -30%);
    }

    @keyframes talking {
      0%   { transform: translate(-50%, -20%) scaleY(0.75); }
      100% { transform: translate(-50%, -20%) scaleY(1.4); }
    }

    #status-banner {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      background: rgba(0,0,0,0.7);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-family: sans-serif;
      z-index: 100;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }
    .book-layer {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 100vw;
      max-width: 1920px;
      height: auto;
      z-index: 10;
      /* Hidden below screen by default */
      transform: translate(-50%, 105%);
      transition: transform 0.6s cubic-bezier(0.2, 0.9, 0.3, 1.1);
      pointer-events: none;
    }
    /* Moves up from the bottom to cover the lower half of the eyes */
    .book-layer.visible {
      transform: translate(-50%, 45%);
    }
    .pupil-layer.is-reading {
      transition: none !important;
      animation: reading-scan 1.2s infinite ease-in-out;
    }

    @keyframes reading-scan {
      0%   { left: 45%; }
      75%  { left: 55%; } /* Scan across to the right */
      85%  { left: 45%; } /* Quick snap back to the left */
      100% { left: 45%; }
    }
  </style>
</head>
<body>

  <div id="status-banner">Tap anywhere to unlock camera, audio & fullscreen</div>

  <div id="container" class="container">
    <div class="svg-layer midground"></div>
    <img id="pupils" class="svg-layer pupil-layer" src="/static/PupilL.svg" alt="Pupil" />
    <img class="svg-layer mask-layer" src="/static/Mask.svg" alt="Mask" />
    <div class="mouth-box">
      <img id="mouth" class="svg-layer mouth-layer" src="/static/Mouth.svg" alt="Mouth" />
    </div>
    <img class="eyelid-layer LBLid" src="/static/Lid.svg">
    <img class="eyelid-layer RBLid" src="/static/Lid.svg">
    <img class="eyelid-layer LTLid" src="/static/Lid.svg">
    <img class="eyelid-layer RTLid" src="/static/Lid.svg">
    <img id="book" class="book-layer" src="/static/book.svg" alt="Book" />
  </div>

  <video id="webcam" autoplay muted playsinline></video>

  <!-- 1. Start Camera & Face Tracking -->
  <script>
    const svgElement = document.querySelector('.pupil-layer');
    const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';

    async function initFaceApi() {
      try {
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);
        navigator.mediaDevices.getUserMedia({
          video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
          audio: false
        }).then(stream => {
          document.getElementById('webcam').srcObject = stream;
        }).catch(err => console.error("Camera error:", err));
      } catch (err) {
        console.error("face-api error:", err);
      }
    }

    const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 320, scoreThreshold: 0.2 });
    let shiftX = 50, shiftY = 50;

    document.getElementById('webcam').addEventListener('play', () => {
      async function trackFace() {
        if (svgElement.classList.contains('is-reading')) {
          requestAnimationFrame(trackFace);
          return;
        }
        const v = document.getElementById('webcam');
        const detection = await faceapi.detectSingleFace(v, detectorOptions);
        if (detection) {
          const centerX = detection.box.x + (detection.box.width / 2);
          const centerY = detection.box.y + (detection.box.height / 2);
          const percentX = Math.abs(100 - (centerX / v.videoWidth) * 100);
          const percentY = Math.abs(100 - (centerY / v.videoHeight) * 100);

          shiftX = 0.2 * ((percentX - 50) / 5 + 50) + 0.8 * shiftX;
          shiftY = 0.2 * (-(percentY - 50) / 2 + 50) + 0.8 * shiftY;

          svgElement.style.left = `${shiftX}%`;
          svgElement.style.top = `${shiftY}%`;
        }
        requestAnimationFrame(trackFace);
      }
      trackFace();
    });

    initFaceApi();
  </script>

  <!-- 2. Tap to Unlock Fullscreen & Audio Autoplay -->
  <script>
    let unlocked = false;
    document.addEventListener('click', () => {
      if (document.body.requestFullscreen) document.body.requestFullscreen().catch(() => {});
      if (!unlocked) {
        const silent = new Audio("data:audio/wav;base64,UklGRigAAABXQVZFZm10IBIAAAABAAEARKwAAIhYAQACABAAAABkYXRhAgAAAAEA");
        silent.play().then(() => {
          unlocked = true;
          const banner = document.getElementById("status-banner");
          if (banner) {
            banner.style.opacity = "0";
            setTimeout(() => banner.remove(), 500);
          }
        }).catch(() => {});
      }
    });
  </script>

  <!-- 3. Eye Blinking Loop -->
  <script>
    const eyelids = document.querySelectorAll('.eyelid-layer');
    function blink_loop() {
      let openTime = Math.random() * 25000 + 2000;
      let blinkTime = Math.random() * 300 + 250;
      let flutter = 1;
      
      if (Math.random() > 0.95) {
        flutter += Math.round(Math.random() * 2);
      }
      
      function blink(flutter) {
        eyelids.forEach(lid => lid.classList.add('closed'));
        setTimeout(() => {
          eyelids.forEach(lid => lid.classList.remove('closed'));
        }, blinkTime);
        
        if (flutter > 1) {
          setTimeout(() => { blink(flutter - 1); }, blinkTime + 100);
        } else {
          setTimeout(blink_loop, openTime);
        }
      }
      blink(flutter);
    }
    blink_loop();
  </script>

  <!-- WebSocket Audio & Client-Side Camera Capture -->
  <script>
    const SERVER_URL = "{{ server_url }}";

    const video = document.getElementById('webcam');
    const mouth = document.getElementById('mouth');

    let currentAudio = null;

    function setTalking(isTalking) {
      if (isTalking) {
        mouth.classList.add("is-talking");
      } else {
        mouth.classList.remove("is-talking");
      }
    }

    function playSound(audioUrl, isFinalResponse = false) {
      if (currentAudio) {
        const old = currentAudio;
        currentAudio = null;
        old.pause();
        old.currentTime = 0;
      }

      const audio = new Audio(audioUrl);
      currentAudio = audio;

      const finished = () => {
        if (audio !== currentAudio) return;
        setTalking(false);
      };

      audio.addEventListener("play", () => {
        if (audio === currentAudio) setTalking(true);
      });
      audio.addEventListener("ended", finished);
      audio.addEventListener("pause", finished);
      audio.addEventListener("error", (e) => {
        finished();
        console.warn("Audio error:", e);
      });

      audio.play().catch(e => console.warn("Playback prevented:", e));
    }

    const ACK_SOUNDS = [
      "/static/audio/hold.wav",
      "/static/audio/hang.wav",
      "/static/audio/gotit.wav",
      "/static/audio/gotcha.wav",
      "/static/audio/just_a_sec.wav",
      "/static/audio/just_a_tick.wav",
      "/static/audio/kay.wav",
      "/static/audio/lemmy_see.wav",
      "/static/audio/ok.wav",
      "/static/audio/on_it.wav",
      "/static/audio/one_moment.wav",
      "/static/audio/one_moment_please.wav",
      "/static/audio/right_oh.wav",
      "/static/audio/right.wav",
      "/static/audio/sure.wav",
      "/static/audio/yeah.wav",
      "/static/audio/yup.wav",
      "/static/audio/yep.wav",
    ];

    ACK_SOUNDS.forEach(src => {
      const a = new Audio();
      a.src = src;
      a.preload = "auto";
    });

    const socket = io(SERVER_URL);

    socket.on("connect", () => {
      console.log("[WebSocket] Connected to Main Server at", SERVER_URL);
    });

    socket.on("play_ack", () => {
      console.log("[WebSocket] Received play_ack signal");
      const randomIndex = Math.floor(Math.random() * ACK_SOUNDS.length);
      const chosenAck = ACK_SOUNDS[randomIndex];
      playSound(chosenAck);
    });

    socket.on("show_book", () => {
      console.log("[WebSocket] Tool usage detected -> Showing book");
      book.classList.add("visible");
      document.getElementById('pupils').classList.add("is-reading");
    });

    socket.on("play_audio", (data) => {
      console.log("[WebSocket] Playing final response audio:", data.url);
      const fullAudioUrl = SERVER_URL + data.url;
      playSound(fullAudioUrl, true);
      
      book.classList.remove("visible");
      document.getElementById('pupils').classList.remove("is-reading");
    });

    socket.on("request_capture", () => {
      if (!video.videoWidth || !video.videoHeight) {
        socket.emit("client_frame", { image: null });
        return;
      }
      const canvas = document.createElement("canvas");
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const b64Data = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
      socket.emit("client_frame", { image: b64Data });
    });
  </script>
</body>
</html>
